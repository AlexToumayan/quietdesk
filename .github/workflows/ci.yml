name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (release)
        run: swift build -c release
      - name: Self-test
        run: .build/release/QuietDesk --self-test
      - name: Unit tests
        run: swift test
      - name: Scenario test (real windows, synthesized clicks, fixture desktop)
        run: |
          D="$RUNNER_TEMP/fixture-desktop"
          mkdir -p "$D/Project A" "$D/Project B" "$D/Archive"
          for f in notes.txt report.txt data.csv todo.md; do echo "fixture" > "$D/$f"; done
          .build/release/QuietDesk --scenario-test --defaults-suite dev.quietdesk.ci --desktop-dir "$D"
      - name: Bundle app
        run: ./scripts/build-app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: QuietDesk.app
          path: build/QuietDesk.app
