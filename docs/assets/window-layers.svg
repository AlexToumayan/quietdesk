<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"><rect width="960" height="360" fill="#fcfcfb" rx="8"/><text x="20" y="30" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600" >Where QuietDesk sits: the stack of window levels, top to bottom</text><rect x="20" y="50" width="920" height="40" rx="8" fill="#f2f1ee" stroke="#e6e5e1"/><text x="36" y="75" font-size="13" fill="#52514e" text-anchor="start" font-weight="600" >Application windows</text><text x="300" y="75" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >normal level (0) and above</text><rect x="20" y="98" width="920" height="40" rx="8" fill="#2a78d6" stroke="#e6e5e1"/><text x="36" y="123" font-size="13" fill="#ffffff" text-anchor="start" font-weight="600" >QuietDesk icon panel</text><text x="300" y="123" font-size="12" fill="#ffffff" text-anchor="start" font-weight="normal" >desktop-icon level + 1: draws icons and labels; keyboard focus without activating</text><rect x="20" y="146" width="920" height="40" rx="8" fill="#86b6ef" stroke="#e6e5e1"/><text x="36" y="171" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" >QuietDesk shield panel</text><text x="300" y="171" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" >desktop-icon level + 1, under the icon panel: bitmap-free, owns wallpaper clicks</text><rect x="20" y="194" width="920" height="40" rx="8" fill="#f2f1ee" stroke="#e6e5e1"/><text x="36" y="219" font-size="13" fill="#52514e" text-anchor="start" font-weight="600" >WindowManager click-catcher</text><text x="300" y="219" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >desktop-icon level, only while items are hidden: a wallpaper click re-shows Finder's icons</text><rect x="20" y="242" width="920" height="40" rx="8" fill="#f2f1ee" stroke="#e6e5e1"/><text x="36" y="267" font-size="13" fill="#52514e" text-anchor="start" font-weight="600" >Finder desktop icons window</text><text x="300" y="267" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >desktop-icon level (-2147483603): emptied by the Show Items setting</text><rect x="20" y="290" width="920" height="40" rx="8" fill="#f2f1ee" stroke="#e6e5e1"/><text x="36" y="315" font-size="13" fill="#52514e" text-anchor="start" font-weight="600" >Wallpaper</text><text x="300" y="315" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >desktop level (-2147483623)</text><text x="20" y="345" font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" >Higher levels are closer to you. Verified with window-server hit tests on macOS 26.6.2 (E4, E8, E10, E11).</text></svg>